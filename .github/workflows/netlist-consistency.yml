name: Netlist consistency

# Offline guard (#107): pvt_tb.spice, rcosc_top.spice and the committed bench
# DUT copies must agree semantically. No PDK, xschem, simulator or network.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  netlist-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python3 -m pip install pytest
      - name: Synthetic fixture suite
        run: python3 -I -m pytest -p no:cacheprovider design/test_netlist_consistency.py
      - name: Committed-tree check
        run: python3 -I design/check-netlist-consistency.py
