name: Doc citations

# Fails when a doc cites a nonexistent sim/<bench>/results/<ts>/ dir, or (in
# the strict docs named by signoff/citations.json) cites a non-current run
# without a superseded/historical/(was ...) marker; when a tracked test_*.py
# is run by no workflow; or when prose restates a klt pin value
# (signoff/verify-pin-restatements.py + signoff/pin-restatements.json,
# issue #408); or when WORK_PLAN.md's generated region holds text the Guide
# renderer cannot emit (signoff/verify-work-plan-region.py, issue #448).
# python3 stdlib only: no PDK, no klt, no ngspice. A separate
# workflow from signoff.yml on purpose: signoff.yml is a hashed, audited
# artifact (T1 item 10), so adding a step there would force a re-pin/re-grade.
# See signoff/README.md, "Doc citation currency" and "Pin restatements".

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  doc-citations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify doc citations of sim/ run dirs
        run: python signoff/verify-doc-citations.py
      # Pin-restatement guard (issue #408): prose must not restate the klt
      # pin values. The declarations (run_checks.sh, signoff.yml's grader
      # install, regen-netlist.sh) are the only sanctioned value statements;
      # dated history, report quotations and the canonical grader-pin
      # statement are exempt via signoff/pin-restatements.json. signoff.yml
      # is read as a declaration but never edited by this guard (#358).
      - name: Verify no prose restates a klt pin value
        run: python3 -I signoff/verify-pin-restatements.py
      - name: Run the pin-restatement guard's own tests (stdlib unittest)
        run: python3 -I signoff/test_verify_pin_restatements.py
      # Orphaned-test guard (issue #134): every tracked test_*.py must be run
      # by some workflow. Stdlib only, like the citation check above.
      - name: Verify every tracked test_*.py is run by a workflow
        run: python3 -I signoff/verify-test-coverage.py
      - name: Run the orphaned-test guard's own tests (stdlib unittest)
        run: python3 -I signoff/test_verify_test_coverage.py
      # Plan-region guard (issue #448): the text between the guide:plan-body
      # markers is render_plan_body()'s byte-compared output, so anything in
      # it the renderer cannot emit (a _Generated: line, a suffix other than
      # *(curated)* / *(architect)* / *(hermit)*) is deleted on the next
      # Guide tick; the guard fails at PR time instead. Text outside the
      # markers is never checked.
      - name: Verify WORK_PLAN.md's generated region is renderer-emittable
        run: python3 -I signoff/verify-work-plan-region.py
      - name: Run the plan-region guard's own tests (stdlib unittest)
        run: python3 -I signoff/test_verify_work_plan_region.py
