name: Offline suites

# Runs the offline, synthetic-fixture pytest suites (sim/waveform,
# sim/supply-transient, sim/trim-interface, sim/trim-transition, sim/trim-dense, the sim/item5 row-map check, and the
# layout/run_checks.sh toolchain-pin preflight, signoff/ grade-drift comparator and
# artifact-provenance/binding guards), plus:
#   - discipline-offline: sim/discipline model tests (issue #120; test_outage.py,
#     the SOF-loss/reacquisition model tests, added by #134).
#   - legacy-analysis-offline: pure analysis cores of sim/pvt, sim/startup and
#     sim/iq (issue #121).
#   - mc-groundwork-offline: DR-0022 section 4 mismatch injector (issue #135).
#   - module-loader-offline: sim/_module_loader.py (issue #130), the shared
#     importlib helper used by the supply-transient, temperature, trim-interface
#     and trim-transition generators, and the sim/ PDK-provenance guards.
#   - temperature-offline: sim/temperature interior-temperature request
#     generation and curvature analysis (issue #125 subset).
# PDK-free, simulator-free,
# cloud-free: python3 + pytest only. Fixtures are SYNTHETIC and are built in
# memory / temporary directories; this job never writes into sim/ results and
# produces no signoff evidence. A separate workflow from signoff.yml on
# purpose: signoff.yml is a hashed, audited artifact (T1 item 10), so adding a
# step there would force refreshing its envelope and report.
#
# The matrix job's `name:` is the matrix `name`, which keeps the check names
# identical to the former one-file-per-suite workflows' job ids.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  offline:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: supply-transient-offline
            tests: sim/supply-transient/test_harness.py
          - name: waveform-offline
            tests: sim/waveform/test_harness.py sim/waveform/test_loadsweep.py
          - name: trim-interface-offline
            tests: sim/trim-interface/test_harness.py
          - name: trim-transition-offline
            tests: sim/trim-transition/test_harness.py
          - name: trim-dense-offline
            tests: sim/trim-dense/test_harness.py
          - name: layout-preflight-offline
            tests: layout/test_run_checks_preflight.py
          - name: signoff-drift-offline
            tests: signoff/test_verify_report_drift.py
          - name: signoff-artifacts-offline
            tests: signoff/test_verify_report_artifacts.py
          - name: discipline-offline
            tests: sim/discipline/test_harness.py sim/discipline/test_outage.py
          - name: legacy-analysis-offline
            tests: sim/legacy-analysis/test_analysis_cores.py sim/legacy-analysis/test_jobs_defaults.py
          - name: mc-groundwork-offline
            tests: sim/mc-groundwork/test_mismatch_inject.py sim/mc-groundwork/test_gen_bench.py
          - name: module-loader-offline
            tests: sim/test_module_loader.py sim/test_pdk_provenance.py
          - name: temperature-offline
            tests: sim/temperature/test_temperature.py
          - name: item5-rows-offline
            tests: sim/item5/test_item5_rows.py
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python3 -m pip install pytest
      - name: Run ${{ matrix.name }} fixture suite (synthetic, not evidence)
        run: python3 -I -m pytest -p no:cacheprovider ${{ matrix.tests }}
