name: Waveform offline suite

# Runs the offline, synthetic-fixture tests of sim/waveform (issue #91 subset).
# PDK-free, simulator-free, cloud-free: python3 + pytest only. Fixtures are
# SYNTHETIC and are generated in temporary directories; this job never writes
# into sim/ results and produces no signoff evidence. A separate workflow from
# signoff.yml on purpose: signoff.yml is a hashed, audited artifact (T1 item
# 10), so adding a step there would force refreshing its envelope and report.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  waveform-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python3 -m pip install pytest
      - name: Run offline waveform fixture suite (synthetic, not evidence)
        run: python3 -I -m pytest -p no:cacheprovider sim/waveform/test_harness.py
