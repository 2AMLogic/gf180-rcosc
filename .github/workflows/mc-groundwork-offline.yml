name: MC-groundwork offline suite

# Runs the offline, synthetic-fixture tests of the DR-0022 section 4 mismatch
# injector (issue #135). PDK-free, simulator-free, cloud-free: python3 +
# pytest only. Produces no evidence and never writes into sim/ results.
# Separate from signoff.yml on purpose (that workflow is a hashed artifact).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  mc-groundwork-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python3 -m pip install pytest
      - name: Run offline mismatch-injector suite (synthetic, not evidence)
        run: python3 -I -m pytest -p no:cacheprovider sim/mc-groundwork/test_mismatch_inject.py
