name: Signoff

# Mechanical re-grading of the klt-signoff block manifest -- the verdict of
# record for this block's T1 (sim-validated) status per
# klayout-tools/docs/design-evidence-tiers.md, replacing the hand-maintained
# checklist in the gap-to-T1 tracker (issue #5).
#
# PDK-free by design: `klt signoff --manifest` on file-backed citations
# grades committed evidence envelopes, it never runs DRC/LVS/sim gates, so
# this job needs no PDK download, no xschem, no ngspice -- it runs on a bare
# ubuntu runner with python3 only (same discipline as the sibling canary
# repos' CI).
#
# What is checked (all inside signoff/verify-report.py):
#   1. `klt signoff --manifest signoff/block-manifest.json --format json`
#      runs clean. Exit 3 means "graded below T1" (unmet items exist) and is
#      data, not failure; exit 1 (a real error) fails the job.
#   2. The fresh per-item grades match the committed verdict of record
#      (signoff/signoff-report.json), and were produced by the pinned
#      grader commit, so a manifest or evidence envelope edited without
#      re-grading and re-committing the report cannot pass.
#   3. Every pinned content_hash matches the current bytes of the artifact it
#      names, so a manifest citing an artifact that has since changed fails
#      rather than rotting. For the artifact-bound items (1, 2, 9, 10) the
#      envelope must also declare the right t1_item and name the right path.
#   4. Every path the two committed inventories (design sources, testbenches)
#      list in their tables still exists.
#
# The klt pin below is load-bearing: the committed report records the
# grading build (`build.git_commit`) and the rulebook hash it graded under
# (`source_doc_content_hash`), and two builds bundling different rulebooks
# legitimately grade different item tables. The pin is klayout-tools commit
# 3a75c3ae (the merge of klayout-tools#2843), the first build that grades
# T1 items 1, 2, 9 and 10 from an artifact-bound generic envelope, which
# signoff/block-manifest.json now cites for those items. It is not a
# release (klt reports 0.6.0+g3a75c3ae705b), so a git-pinned commit is the
# only installable grader that reproduces the committed report. Move it
# only per signoff/README.md's refresh contract (re-grade, re-commit).
#
# This workflow file is itself the audited artifact T1 item 10 (repo
# hygiene) is bound to (signoff/repo-hygiene-envelope.json pins its
# sha256), so any edit here -- including moving the pin -- must refresh
# that envelope, the manifest pin, and the committed report together.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: signoff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signoff:
    name: klt signoff --manifest (re-grade committed evidence)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the pinned klt grader
        run: |
          python -m pip install --upgrade pip
          python -m pip install "klayout-tools @ git+https://github.com/2AMLogic/klayout-tools@3a75c3ae705b7ad3803625255de93bcd982e70c6"
          klt --version

      - name: Re-grade the manifest and verify the committed pins
        run: python signoff/verify-report.py
