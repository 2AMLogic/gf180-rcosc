name: Layout preflight offline suite

# Runs the offline tests of layout/run_checks.sh's toolchain-pin preflight
# (issue #115). PDK-free, KLayout-free, network-free: python3 + pytest only,
# with fake klt / python3 / uv commands in temporary directories. This job
# never regenerates layout evidence and produces no signoff evidence.
# Separate from signoff.yml on purpose (that workflow is a hashed, audited
# artifact).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  layout-preflight-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python3 -m pip install pytest
      - name: Run offline run_checks.sh preflight suite (synthetic, not evidence)
        run: python3 -I -m pytest -p no:cacheprovider layout/test_run_checks_preflight.py
